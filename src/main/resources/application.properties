# SERVER
server.port=8082

# APP
spring.application.name=product-service
spring.profiles.active=local

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/sayurku_product_db
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# TOKEN INTERNAL (header X-Internal-Token untuk jalur /internal).
# Diisi di application-local.properties atau env INTERNAL_TOKEN; kosong = aplikasi gagal start.

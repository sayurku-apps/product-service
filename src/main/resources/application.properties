# SERVER
server.port=8082

# APP
spring.application.name=product-service
spring.profiles.active=local

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/sayurku_product_db
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# FLYWAY. Database lama (dibuat ddl-auto=update sebelum Flyway) dianggap sudah di versi 1,
# jadi V1__init.sql dilewati di sana dan hanya jalan di database kosong.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
# Skema dibuat Flyway (db/migration/V*.sql), Hibernate cuma mengecek entity cocok dengan tabel.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# TOKEN INTERNAL (header X-Internal-Token untuk jalur /internal).
# Diisi di application-local.properties atau env INTERNAL_TOKEN; kosong = aplikasi gagal start.
